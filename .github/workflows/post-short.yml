name: Post next short (3D series)

on:
  schedule:
    # 13:07 IST every day (07:37 UTC). Voice reels stay on post.yml at 19:23 IST.
    - cron: "37 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test run: process the video but don't publish"
        type: boolean
        default: true

concurrency: post-reel

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - id: post
        name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGES_BASE: ${{ vars.PAGES_BASE }}
          QUEUE_DIR: queue_short
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: python scripts/post_next.py
      - name: Upload to YouTube (Shorts)
        if: steps.post.outputs.posted != ''
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/yt_upload.py "posted/${{ steps.post.outputs.posted }}"
      - name: Record what was posted
        if: steps.post.outputs.posted != ''
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add -A queue_short posted posted.json
          if [ -f yt_posted.json ]; then git add yt_posted.json; fi
          git commit -m "Posted short ${{ steps.post.outputs.posted }}"
          git pull --rebase
          git push
          echo "### Posted ✅ ${{ steps.post.outputs.permalink }}" >> "$GITHUB_STEP_SUMMARY"
